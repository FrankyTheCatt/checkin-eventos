<h2 mat-dialog-title>Eliminar evento</h2>
<mat-dialog-content
  ><p>¿Quieres eliminar «{{ data.title }}»?</p>
  <p>
    También se eliminarán sus asistencias. Esta acción no se puede deshacer.
  </p></mat-dialog-content
><mat-dialog-actions align="end"
  ><button mat-button [mat-dialog-close]="false" cdkFocusInitial>Cancelar</button
  ><button mat-flat-button [mat-dialog-close]="true">Eliminar</button></mat-dialog-actions
>
