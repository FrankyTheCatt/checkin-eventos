<div class="auth-container">
  <mat-card class="auth-card">
    <mat-card-header>
      <mat-card-title>Crear Cuenta</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <form [formGroup]="registroForm" (ngSubmit)="onSubmit()">
        
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Nombre completo</mat-label>
          <input matInput type="text" formControlName="full_name" placeholder="Ej. Ana Pérez">
          <mat-error *ngIf="registroForm.get('full_name')?.hasError('required')">El nombre es obligatorio</mat-error>
          <mat-error *ngIf="registroForm.get('full_name')?.hasError('minlength')">Mínimo 2 caracteres</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Correo electrónico</mat-label>
          <input matInput type="email" formControlName="email" placeholder="ejemplo@correo.com">
          <mat-error *ngIf="registroForm.get('email')?.hasError('required')">El correo es obligatorio</mat-error>
          <mat-error *ngIf="registroForm.get('email')?.hasError('email')">Formato inválido</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Contraseña</mat-label>
          <input matInput type="password" formControlName="password">
          <mat-error *ngIf="registroForm.get('password')?.hasError('required')">La contraseña es obligatoria</mat-error>
          <mat-error *ngIf="registroForm.get('password')?.hasError('minlength')">Mínimo 8 caracteres</mat-error>
        </mat-form-field>

        <button mat-flat-button color="primary" type="submit" class="full-width" [disabled]="registroForm.invalid || cargando()">
          {{ cargando() ? 'Registrando...' : 'Registrarse' }}
        </button>

      </form>
      <div class="auth-links">
        <p>¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión aquí</a></p>
      </div>
    </mat-card-content>
  </mat-card>
</div>
