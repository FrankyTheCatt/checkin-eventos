<h2 mat-dialog-title>{{ data ? 'Editar' : 'Crear' }} Evento</h2>
<mat-dialog-content>
  <form [formGroup]="form" class="form-container">
    
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Título</mat-label>
      <input matInput formControlName="title">
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Descripción</mat-label>
      <textarea matInput formControlName="description" rows="3"></textarea>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Ubicación</mat-label>
      <input matInput formControlName="location_name">
    </mat-form-field>

    <div class="date-row">
      <mat-form-field appearance="outline">
        <mat-label>Inicio</mat-label>
        <input matInput formControlName="starts_at" type="datetime-local">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Fin</mat-label>
        <input matInput formControlName="ends_at" type="datetime-local">
      </mat-form-field>
    </div>

  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cancelar</button>
  <button mat-flat-button color="primary" [disabled]="form.invalid" (click)="guardar()">Guardar</button>
</mat-dialog-actions>
