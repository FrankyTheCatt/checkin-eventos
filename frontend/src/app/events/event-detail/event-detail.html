<div class="detail-container">
  <div *ngIf="cargando()" class="loading-state">
    <mat-spinner diameter="40"></mat-spinner>
    <p>Cargando detalles...</p>
  </div>

  <mat-card *ngIf="!cargando() && evento()" class="event-card">
    <mat-card-header>
      <mat-card-title>{{ evento().title }}</mat-card-title>
      <mat-card-subtitle>{{ evento().location_name }}</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <p class="description">{{ evento().description || 'Sin descripción' }}</p>
      
      <div class="info-grid">
        <div class="info-item">
          <mat-icon color="primary">event</mat-icon>
          <span><strong>Inicio:</strong> {{ evento().starts_at | date:'short' }}</span>
        </div>
        <div class="info-item">
          <mat-icon color="primary">event_busy</mat-icon>
          <span><strong>Fin:</strong> {{ evento().ends_at | date:'short' }}</span>
        </div>
        <div class="info-item">
          <mat-icon color="primary">group</mat-icon>
          <span><strong>Asistentes:</strong> {{ evento().attendance_count }}</span>
        </div>
      </div>
    </mat-card-content>

    <mat-card-actions class="actions-row">
      <button mat-stroked-button routerLink="/eventos">Volver</button>
      
      <button mat-flat-button color="accent" (click)="registrarAsistencia()">
        <mat-icon>check_circle</mat-icon> Registrar Asistencia
      </button>
      
      <!-- Controles visibles solo si el usuario activo es el creador del evento -->
      <ng-container *ngIf="evento().owner_id === authService.usuario()?.id">
        <span class="spacer"></span>
        <button mat-icon-button color="primary" title="Editar">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="warn" title="Eliminar">
          <mat-icon>delete</mat-icon>
        </button>
      </ng-container>
    </mat-card-actions>
  </mat-card>
</div>
