services:
  db:
    image: postgres:16-alpine
    container_name: checkin-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: checkin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: checkin
    ports:
      - "5433:5432"
    volumes:
      - checkin-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U checkin -d checkin"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  checkin-data: